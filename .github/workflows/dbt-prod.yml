# Runs `dbt build --target prod` (DEV_PAYROLL_DB.APP_PROD + RPT_PROD). Manual only: Actions tab -> "Run workflow".
# The job pauses for approval when the GitHub Environment `prod` (repo Settings -> Environments) has required reviewers.
# Same secrets as uat (SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PAT); the `prod` environment can override them with its own.
name: EuroCham dbt build (prod)

on:
  workflow_dispatch:

concurrency: eurocham-dbt-prod  

jobs:
  build:
    runs-on: ubuntu-latest
    environment: prod
    env:
      SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PAT }}   
      SNOWFLAKE_ROLE:      <PROD_DEPLOY_ROLE>        
      SNOWFLAKE_WAREHOUSE: <PROD_WH>
      SNOWFLAKE_DATABASE:  <PROD_DB>
      SNOWFLAKE_SCHEMA:    APP       # Production Schema should be named as APP (consistent with Power APP)            
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: snowflakedb/snowflake-actions@v3      # installs the Snowflake CLI
      - name: Create the project schema if missing (the project object is deployed into it)
        run: snow sql -x --schema PUBLIC -q "CREATE SCHEMA IF NOT EXISTS ${SNOWFLAKE_DATABASE}.${SNOWFLAKE_SCHEMA}"
      - run: snow connection test -x
      - run: snow dbt deploy EUROCHAM_PAYROLL_DBT_PROD --source "EuroCham Payroll dbt" -x
      - run: snow dbt execute -x EUROCHAM_PAYROLL_DBT_PROD build --target prod
