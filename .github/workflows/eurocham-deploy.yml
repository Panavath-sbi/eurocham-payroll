# Deploys what is pending in ddl/ (object definitions) and then dml/ (DML, grants, data fixes, one-off changes) with
# deploy/deploy.py: each file runs once (APP.T_F_DEPLOY_HISTORY), changed views / procedures / functions run again.
# Then it verifies the result (DEPLOYMENT CONFIRMED).
#   Push to dev          -> uat.  dev holds exactly what runs in uat.
#   Push to release/*    -> validate only (read-only, uat and prod): file rules, what would run / is blocked, VERIFY.
#                           Nothing is executed. The release branch takes dev, resolves conflicts, then a PR into main.
#   Merge to main        -> nothing runs. prod is deployed by hand: Actions -> EuroCham deploy -> Run workflow, branch main,
#                           environment prod. Changes reach main by a pull request from release/*.
#   "Run workflow"       -> the environment you choose (uat / prod).
# prod always runs in the GitHub Environment `prod`, so it waits for the Snowflake Administrator's approval.
# Secrets (repo level, one service user): SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PAT. Warehouse: the user's default.
# The environment expression (chosen input, else main -> prod, else uat) is repeated where GitHub does not allow `env`. new push commit
name: EuroCham deploy
run-name: EuroCham deploy | ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'uat') }} | ${{ github.ref_name }}

on:
  push:
    branches: [dev, 'release/**']   # main: manual only (Run workflow), never on merge
    paths: ['ddl/**', 'dml/**', 'deploy/**', '.github/workflows/eurocham-deploy.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (prod waits for approval)'
        type: choice
        options: [uat, prod]
        default: uat
        required: true

concurrency: eurocham-deploy-${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'uat') }}   # one run at a time per environment

jobs:
  validate:                         # release/*: read-only dry run against uat and prod, no approval needed
    if: startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false              # always show both environments
      matrix:
        target: [uat, prod]
    env:
      SNOWFLAKE_ACCOUNT:  ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:     ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet snowflake-snowpark-python pyyaml
      - name: Validate ${{ matrix.target }} (dry run + VERIFY, nothing is executed)
        run: python deploy/deploy.py ${{ matrix.target }}

  deploy:
    if: ${{ !startsWith(github.ref_name, 'release/') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'uat') }}
    env:
      TARGET:             ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'uat') }}   # block in deploy/config.yml
      SNOWFLAKE_ACCOUNT:  ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:     ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PAT }}      # PAT is accepted as the password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0                  # full history: the log records the scripts changed since the last deployment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet snowflake-snowpark-python pyyaml
      - name: Diagnose the Snowflake account (temporary)   # ponytail: remove once the connection works
        run: |
          a="$SNOWFLAKE_ACCOUNT"
          case "$a" in *https*|*snowflakecomputing*) echo "ACCOUNT SECRET: remove https:// / .snowflakecomputing.com";; esac
          [ "$a" != "$(echo "$a" | tr -d '[:space:]')" ] && echo "ACCOUNT SECRET: contains spaces or a newline"
          echo "HTTP status of the account URL:"
          curl -s -o /dev/null -w '%{http_code}\n' --max-time 20 "https://$(echo "$a" | tr -d '[:space:]').snowflakecomputing.com/console/login" || echo "UNREACHABLE (no answer from GitHub's network)"
          python -c "import snowflake.connector, logging, os; logging.basicConfig(level=logging.ERROR); snowflake.connector.connect(account=os.environ['SNOWFLAKE_ACCOUNT'].strip(), user=os.environ['SNOWFLAKE_USER'].strip(), password=os.environ['SNOWFLAKE_PASSWORD'].strip(), login_timeout=30); print('STRIPPED SECRETS CONNECT: OK')" 2>&1 | tail -5 || true
      - name: Check the Snowflake connection
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, 'deploy')
          secrets = {'SNOWFLAKE_ACCOUNT': 'SNOWFLAKE_ACCOUNT', 'SNOWFLAKE_USER': 'SNOWFLAKE_USER', 'SNOWFLAKE_PASSWORD': 'SNOWFLAKE_PAT'}
          if missing := [s for v, s in secrets.items() if not os.environ.get(v)]:
              sys.exit(f'CONNECTION FAILED: GitHub secret(s) not set: {", ".join(missing)}')
          import deploy
          try:
              user, role, wh, account = deploy.get_session().sql(
                  'SELECT CURRENT_USER(), CURRENT_ROLE(), CURRENT_WAREHOUSE(), CURRENT_ACCOUNT()').collect()[0]
          except Exception as e:
              sys.exit(f'CONNECTION FAILED: {deploy.first_line(e)}')
          print(f'CONNECTED to Snowflake account {account} as {user} (role {role}, warehouse {wh or "none - set a default warehouse"})')
          EOF
      - name: Deploy to ${{ env.TARGET }} and verify
        run: python deploy/deploy.py "$TARGET" --run
