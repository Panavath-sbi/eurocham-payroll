
name: EuroCham deploy
run-name: EuroCham deploy | ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'uat') }} | ${{ inputs.mode || 'run' }} | ${{ github.ref_name }}

on:
  push:
    branches: [dev-1.0.1, 'release/**']   # main: manual only (Run workflow), never on merge
    paths: ['ddl/**', 'dml/**', 'deploy/**', '.github/workflows/eurocham-deploy.yml']
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (prod waits for approval)'
        type: choice
        options: [uat, prod]
        default: uat
        required: true
      mode:
        description: 'run = deploy what is pending; dry-run = only show what would run'
        type: choice
        options: [run, dry-run]
        default: run
        required: true

concurrency: eurocham-deploy-${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'uat') }}   # one run at a time per environment

jobs:
  validate:                         # release/*: dry run against uat and prod, no approval needed
    if: startsWith(github.ref_name, 'release/')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false              # always show both environments
      matrix:
        target: [uat, prod]
    env:
      SNOWFLAKE_ACCOUNT:  ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:     ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PAT }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0                  # --init reads origin/main: the files prod was built from
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet snowflake-snowpark-python pyyaml
      - name: Validate ${{ matrix.target }} (VERIFY with missing / changed objects; runs nothing)
        run: python deploy/deploy.py ${{ matrix.target }} --init

  deploy:
    if: ${{ !startsWith(github.ref_name, 'release/') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'uat') }}
    env:
      TARGET:             ${{ inputs.environment || (github.ref_name == 'main' && 'prod' || 'uat') }}   # block in deploy/config.yml
      MODE:               ${{ inputs.mode || 'run' }}                                                    # push to dev: run
      SNOWFLAKE_ACCOUNT:  ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:     ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PAT }}      # PAT is accepted as the password
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet snowflake-snowpark-python pyyaml
      - name: Check the Snowflake connection
        run: |
          python - <<'EOF'
          import os, sys
          sys.path.insert(0, 'deploy')
          secrets = {'SNOWFLAKE_ACCOUNT': 'SNOWFLAKE_ACCOUNT', 'SNOWFLAKE_USER': 'SNOWFLAKE_USER', 'SNOWFLAKE_PASSWORD': 'SNOWFLAKE_PAT'}
          if missing := [s for v, s in secrets.items() if not os.environ.get(v)]:
              sys.exit(f'CONNECTION FAILED: GitHub secret(s) not set: {", ".join(missing)}')
          import deploy
          try:
              user, role, wh, account = deploy.get_session().sql(
                  'SELECT CURRENT_USER(), CURRENT_ROLE(), CURRENT_WAREHOUSE(), CURRENT_ACCOUNT()').collect()[0]
          except Exception as e:
              sys.exit(f'CONNECTION FAILED: {deploy.first_line(e)}')
          print(f'CONNECTED to Snowflake account {account} as {user} (role {role}, warehouse {wh or "none - set a default warehouse"})')
          EOF
      - name: ${{ env.MODE }} on ${{ env.TARGET }} and verify
        run: python deploy/deploy.py "$TARGET" $([ "$MODE" = dry-run ] || echo "--$MODE")   # dry-run = no flag
