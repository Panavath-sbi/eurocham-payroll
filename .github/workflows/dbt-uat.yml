# Runs `dbt build` on uat (DEV_PAYROLL_DB.APP_UAT + RPT_UAT, default target in profiles.yml) on every push to the eurocham-uat branch that touches the dbt project.
# Snowflake runs dbt itself: the CLI uploads the project into a dbt Project object, then executes it.
# Secrets (repo Settings -> Secrets and variables -> Actions): SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PAT.
name: EuroCham dbt build (uat)

on:
  push:
    branches: [eurocham-uat]
    paths:
      - 'EuroCham Payroll dbt/**'
      - '.github/workflows/dbt-uat.yml'
  workflow_dispatch:            # "Run workflow" button in GitHub, for re-runs

concurrency: eurocham-dbt-uat   # one build at a time against APP_UAT / RPT_UAT

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SNOWFLAKE_ACCOUNT:   ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:      ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD:  ${{ secrets.SNOWFLAKE_PAT }}   # PAT is accepted as the password
      SNOWFLAKE_ROLE:      SF_APA_PAYROLL-DBA               # owns the schemas; must match the uat role in profiles.yml
      SNOWFLAKE_WAREHOUSE: SANDBOX_WH
      SNOWFLAKE_DATABASE:  DEV_PAYROLL_DB
      SNOWFLAKE_SCHEMA:    APP_UAT                          # dbt Project object lives here; must exist (snowflake/config/02_schema.sql)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: snowflakedb/snowflake-actions@v3      # installs the Snowflake CLI
      - run: snow connection test -x
      - run: snow dbt deploy EUROCHAM_PAYROLL_DBT_UAT --source "EuroCham Payroll dbt" -x
      - run: snow dbt execute -x EUROCHAM_PAYROLL_DBT_UAT build
