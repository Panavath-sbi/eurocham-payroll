# Deploys deployment/ (EuroCham tables, views, procedures) on every push to main, after approval by the Snowflake
# Administrator (required reviewer of the GitHub Environment `prod`), then verifies it.
# main holds exactly what runs in prod; changes reach it only by a pull request from eurocham-dev.
# END-TO-END TESTING: this still deploys to uat. After testing, change `uat` to `prod` in the last line.
# Secrets (repo level, one service user): SNOWFLAKE_ACCOUNT, SNOWFLAKE_USER, SNOWFLAKE_PAT. Warehouse: the user's default.
name: EuroCham deploy (prod)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      only:
        description: 'Scripts to deploy, space-separated (e.g. t_d_employee v_d_employee). Empty = all'
        required: false

concurrency: eurocham-deploy-uat          # testing against uat; becomes eurocham-deploy-prod with the switch to prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: prod                     # waits for the Snowflake Administrator's approval
    env:
      SNOWFLAKE_ACCOUNT:  ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER:     ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PAT }}      # PAT is accepted as the password
      ONLY:               ${{ inputs.only }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install snowflake-snowpark-python pyyaml
      - run: python deployment/deploy.py uat $ONLY            # TODO after end-to-end testing: uat -> prod
