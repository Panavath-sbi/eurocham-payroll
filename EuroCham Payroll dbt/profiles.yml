EUROCHAM_PAYROLL:
  target: prod
  outputs:
    # Tables + procedures go to APP, views to RPT (macros/generate_schema_name.sql); `schema` below is only dbt's default.
    # This account
    dev:
      type: snowflake
      role: '"SF_APA_PAYROLL-DBA"'
      warehouse: SANDBOX_WH
      database: DEV_PAYROLL_DB
      schema: APP
      threads: 8
    # This account, same database as dev: APP_UAT + RPT_UAT
    uat:
      type: snowflake
      role: '"SF_APA_PAYROLL-DBA"'
      warehouse: SANDBOX_WH
      database: DEV_PAYROLL_DB
      schema: APP_UAT
      threads: 8
    # For now: same account and database as dev, APP_PROD + RPT_PROD (Snowflake Env Setup/config.yml). Default target.
    prod:
      type: snowflake
      role: '"SF_APA_PAYROLL-DBA"'
      warehouse: SANDBOX_WH
      database: DEV_PAYROLL_DB
      schema: APP_PROD
      threads: 8
